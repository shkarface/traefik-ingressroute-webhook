apiVersion: v1
kind: Service
metadata:
  name: {{ include "tirw.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tirw.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tirw.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
