apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tirw.fullname" . }}
  labels:
    {{- include "tirw.labels" . | nindent 4 }}
rules:
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares", "traefikservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tirw.fullname" . }}
  labels:
    {{- include "tirw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tirw.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tirw.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
